name: Native compiler

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bootstrap and test Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap openssl ca-certificates gcc g++ clang xvfb xauth libx11-dev libpng-dev qemu-system-x86 libsdl2-dev libsdl2-ttf-dev libgdk-pixbuf-2.0-0 libfontconfig1 fonts-dejavu-core fonts-noto-core fonts-noto-cjk libxtst6 libgl1-mesa-dri libglx-mesa0 glslang-tools libegl1 libegl-mesa0 libsqlite3-0 libzstd1 python3 qemu-user lld
          # Ubuntu's default unconfined user-namespace policy denies the
          # network setup needed by --unshare-all. Permit namespaces for this
          # verifier alone on the disposable runner, without a global sysctl.
          if [ -f /sys/module/apparmor/parameters/enabled ] && \
             grep -q Y /sys/module/apparmor/parameters/enabled; then
            for profile in /etc/apparmor.d/bwrap /etc/apparmor.d/bwrap-userns-restrict; do
              if [ -f "$profile" ]; then
                sudo apparmor_parser --remove "$profile"
              fi
            done
            sudo tee /etc/apparmor.d/flexscript-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile flexscript-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser --replace /etc/apparmor.d/flexscript-bwrap
          fi

      - name: Download and verify the original bootstrap compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/seed
          gh release download 0.0.1 --repo J45k4/flexscript --dir build/seed \
            --pattern flexscript-0.0.1-linux-x86_64 --pattern SHA256SUMS
          (cd build/seed && sha256sum --check SHA256SUMS)
          chmod +x build/seed/flexscript-0.0.1-linux-x86_64
          test "$(build/seed/flexscript-0.0.1-linux-x86_64 --version)" = 'flexscript 0.0.1'
          # Released Flexscript builds the host tools; the frozen 0.0.1 seed
          # still supplies the independent compiler bootstrap origin.
          mkdir -p build/tools-seed
          gh release download 0.0.5 --repo J45k4/flexscript --dir build/tools-seed \
            --pattern flexscript-0.0.5-linux-x86_64 \
            --pattern flexscript-core-0.0.5-linux-x86_64 --pattern SHA256SUMS
          (cd build/tools-seed && sha256sum --check SHA256SUMS)
          chmod +x build/tools-seed/flexscript-0.0.5-linux-x86_64
          test "$(build/tools-seed/flexscript-0.0.5-linux-x86_64 --version)" = 'flexscript 0.0.5'
          build/tools-seed/flexscript-0.0.5-linux-x86_64 scripts/bootstrap.flex -o build/bootstrap

      - name: Build three stages and verify self-hosting, imports, FFI, networking, signatures, upgrades and VM/JIT
        run: build/bootstrap --compiler build/seed/flexscript-0.0.1-linux-x86_64

      - name: Test native application examples
        run: |
          build/stage2 scripts/build-tools.flex -o build/build-tools
          build/build-tools --compiler build/stage2
          build/tools/test-tetris --compiler build/stage2
          xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24 -nolisten tcp' \
            build/tools/test-todo --compiler build/stage2 --gui
          build/tools/test-http --compiler build/stage2
          xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24 -nolisten tcp' \
            build/tools/test-gui build/stage2 --gui --report build/gui-report.json

      - name: Test Collie conversations and restricted VM execution
        run: |
          build/tools/test-collie --compiler build/stage2 --vm
          python3 apps/collie/tests/tui.py --compiler build/stage2 --vm

      - name: Verify Android worker broker and VM continuation checkpoints under ARM64 QEMU
        run: |
          python3 scripts/build-collie-android.py --compiler build/stage2 --native-only --out build/android-worker-tests
          python3 scripts/test-collie-android.py --out build/android-worker-tests
          python3 scripts/test-collie-workers.py --out build/android-worker-tests
          python3 scripts/test-collie-signals.py --out build/android-worker-tests
          python3 scripts/test-collie-recall.py --out build/android-worker-tests
          python3 scripts/test-collie-thinking.py --out build/android-worker-tests
          python3 scripts/test-collie-core.py --out build/android-worker-tests
          build/stage2 apps/collie/tests/shared-core.flex -o build/test-collie-shared-core
          python3 scripts/test-collie-core.py --out build/android-worker-tests --core-driver build/test-collie-shared-core

      - name: Install the WebAssembly test host
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Test WebAssembly output and compiler self-hosting
        run: build/tools/test-wasm build/stage2 --report build/wasm-tests.json

      - name: Test installed libraries and Monolith native and browser apps
        run: |
          build/tools/test-libraries build/stage2 --report build/library-tests.json
          build/tools/build-monolith --compiler build/stage2
          build/test-monolith-syntax build/stage2 --report build/monolith-syntax-tests.json
          build/test-monolith-integration build/stage2
          build/test-monolith-integration build/stage2 --source
          build/test-monolith-browser build/stage2 google-chrome --source
          build/test-monolith-browser build/monolith-todo google-chrome

      - name: Test portable UI AST, ARM64 patches and real DOM adapter
        run: |
          python3 scripts/ui-assets.py --check
          python3 scripts/test-ui.py --compiler build/stage2 --out build/android-worker-tests
          python3 scripts/test-collie-ui.py --compiler build/stage2 --out build/android-worker-tests
          xvfb-run -a python3 scripts/test-ui-desktop.py --compiler build/stage2 --x11
          build/stage2 examples/ui/collie-permissions.flex -o build/ui-permissions-web
          build/stage2 examples/ui/counter.flex -o build/ui-counter
          build/stage2 tests/ui/browser.flex -o build/test-ui-browser
          build/test-ui-browser build/ui-permissions-web google-chrome build/ui-counter

      - name: Test native Zstd format and mixed-backend FlexDB files
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-zstd.py

      - name: Test native word expression optimizations against an independent oracle
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-native-constants.py

      - name: Test native reachability and compact calling conventions
        run: build/tools/test-native-size build/stage2 --report build/native-size-tests.json

      - name: Test short branch encodings and signed-distance boundaries
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-short-branches.py

      - name: Test direct comparison branches and short-circuit values
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-condition-branches.py

      - name: Test shared IR optimization across execution backends
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-ir-opt.py

      - name: Test common subexpression elimination
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-ir-cse.py

      - name: Test shared function effects and call barriers
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-ir-effects.py

      - name: Test CFG liveness and native register preservation
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-ir-liveness.py

      - name: Test the default native IR pipeline and direct reference path
        run: FLEX_COMPILER=build/stage2 python3 scripts/test-native-pipeline.py

      - name: Test buffered native word I/O and failure recovery
        run: python3 tests/word-io/check.py build/stage2

      - name: Test experimental GPU compilation without a device
        run: build/tools/test-gpu --compiler build/stage2 --report build/gpu-tests.json

      - name: Test direct Turing machine-code emission without CUDA tooling
        run: build/tools/test-sass --compiler build/stage2 --report build/sass-tests.json

      - name: Test GPU feature lowering without a device
        run: build/tools/test-gpu-features --compiler build/stage2 --report build/gpu-features.json

      - name: Test direct floating-point divide and square-root emission
        run: build/tools/test-sass-float --compiler build/stage2 --report build/sass-float-tests.json

      - name: Test frontend extensions across interpreter, JIT, native and WebAssembly
        run: build/tools/test-extensions build/stage2 --report build/extensions-tests.json

      - name: Test large SetaScript function graphs across native, Wasm and VM/JIT
        run: build/tools/test-seta-functions build/stage2 --report build/seta-functions-tests.json

      - name: Test SetaScript shader targets, OpenGL and WebGPU execution
        run: |
          build/tools/test-shaders build/stage2 --report build/shader-tests.json
          mkdir -p build/shaders
          for source in examples/seta/shaders/*.seta tests/shaders/*.seta; do
            name=$(basename "$source" .seta)
            build/stage2 --target glsl "$source" -o "build/shaders/$name.glsl"
            build/stage2 --target wgsl "$source" -o "build/shaders/$name.wgsl"
          done
          build/tools/shader-gpu-run --dir build/shaders
          bun scripts/shader-webgpu-test.js --dir build/shaders --browser google-chrome

      - name: Test compile-time program transformations and autodiff
        run: build/tools/test-transforms --compiler build/stage2 --report build/transform-tests.json

      - name: Test ML tensors, reverse-mode gradients and training
        run: build/tools/test-ml --compiler build/stage2 --report build/ml-tests.json

      - name: Test Pup graphs and source frontend kernel compilation
        run: build/tools/test-pup --compiler build/stage2 --report build/pup-tests.json

      - name: Test optimizing CPU kernels and word semantics
        run: build/tools/test-cpu-cxx build/stage2 --report build/cpu-cxx-tests.json

      - name: Test explicit lowering hooks and native floating point
        run: build/tools/test-lowering build/stage2 --report build/lowering-tests.json

      - name: Test portable binary64 arithmetic against preserved Rust bit patterns
        run: build/tools/test-f64 build/stage2 --report build/f64-tests.json

      - name: Test portable libm helpers against original result bits
        run: build/tools/test-f64-math build/stage2 --report build/f64-math-tests.json

      - name: Test the freestanding x86-64 backend in QEMU
        run: |
          build/stage2 scripts/test-baremetal.flex -o build/test-baremetal
          build/test-baremetal --compiler build/stage2 --report build/baremetal-tests.json

      - name: Test KVM ABI and loaders, and hardware guests when available
        run: |
          build/stage2 scripts/test-kvm.flex -o build/test-kvm
          build/test-kvm --compiler build/stage2

      - name: Check release tag and package the verified compiler
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "$(cat VERSION)"
          fi
          build/tools/package
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload compiler, checksums, release notes and verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flexscript-linux-x86_64
          path: |
            dist/
            build/bootstrap-report.json
            build/tests.json
            build/import-tests.json
            build/url-imports-tests.json
            build/upgrade-tests.json
            build/signature-tests.json
            build/ffi-tests.json
            build/network-tests.json
            build/vm-tests.json
            build/native-size-tests.json
            build/wasm-tests.json
            build/gpu-tests.json
            build/sass-tests.json
            build/sass-float-tests.json
            build/gpu-features.json
            build/extensions-tests.json
            build/seta-functions-tests.json
            build/shader-tests.json
            build/transform-tests.json
            build/ml-tests.json
            build/pup-tests.json
            build/clean-room.json
            build/harness-tests.json
            build/gui-report.json
            build/library-tests.json
            build/monolith-syntax-tests.json
            build/ui-tests.json
            build/collie-ui-report.json
            build/ui-desktop-report.json
            build/ui-desktop-*.png
            build/ui-permissions-browser.png
            build/collie-ui-browser.png
            build/monolith-*.png
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged compiler
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the tagged signing code and pinned public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified compiler from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flexscript-linux-x86_64
          path: artifact

      - name: Sign the verified release checksums
        env:
          FLEXSCRIPT_RELEASE_SIGNING_KEY: ${{ secrets.FLEXSCRIPT_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chmod +x "artifact/dist/flexscript-$RELEASE_TAG-linux-x86_64"
          "artifact/dist/flexscript-$RELEASE_TAG-linux-x86_64" scripts/sign-release.flex -o /tmp/sign-release
          /tmp/sign-release --dist-dir artifact/dist --version "$RELEASE_TAG"

      - name: Verify and publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifact/dist
          sha256sum --check SHA256SUMS
          chmod +x "flexscript-$RELEASE_TAG-linux-x86_64"
          test "$(./flexscript-"$RELEASE_TAG"-linux-x86_64 --version)" = "flexscript $RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "Flexscript $RELEASE_TAG native compiler" \
            --notes-file release-notes.md \
            "flexscript-$RELEASE_TAG-linux-x86_64" \
            "flexscript-core-$RELEASE_TAG-linux-x86_64" \
            "flexscript-libraries-$RELEASE_TAG.tar.gz" SHA256SUMS SHA256SUMS.sig
