name: Native compiler

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bootstrap and test Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clean-room verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Download and verify the original bootstrap compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/seed
          gh release download 0.0.1 --repo J45k4/flexscript --dir build/seed \
            --pattern flexscript-0.0.1-linux-x86_64 --pattern SHA256SUMS
          (cd build/seed && sha256sum --check SHA256SUMS)
          chmod +x build/seed/flexscript-0.0.1-linux-x86_64
          test "$(build/seed/flexscript-0.0.1-linux-x86_64 --version)" = 'flexscript 0.0.1'

      - name: Build three stages and verify self-hosting, core tests and imports
        run: python3 scripts/bootstrap.py --compiler build/seed/flexscript-0.0.1-linux-x86_64

      - name: Test native application examples
        run: |
          python3 scripts/test-tetris.py --compiler build/stage2
          python3 scripts/test-todo.py --compiler build/stage2
          python3 scripts/test-http.py --compiler build/stage2

      - name: Check release tag and package the verified compiler
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "$(cat VERSION)"
          fi
          python3 scripts/package.py
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload compiler, checksums, release notes and verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flexscript-linux-x86_64
          path: |
            dist/
            build/bootstrap-report.json
            build/tests.json
            build/import-tests.json
            build/clean-room.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged compiler
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified compiler from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flexscript-linux-x86_64
          path: artifact

      - name: Verify and publish the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifact/dist
          sha256sum --check SHA256SUMS
          chmod +x "flexscript-$RELEASE_TAG-linux-x86_64"
          test "$(./flexscript-"$RELEASE_TAG"-linux-x86_64 --version)" = "flexscript $RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "Flexscript $RELEASE_TAG native compiler" \
            --notes-file release-notes.md \
            "flexscript-$RELEASE_TAG-linux-x86_64" SHA256SUMS
